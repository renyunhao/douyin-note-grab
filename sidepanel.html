<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <h1>抖音图文取图</h1>

    <div class="row">
      <label>关键词 <input id="keyword" type="text" placeholder="收纳" /></label>
      <label>数量 <input id="count" type="number" value="20" min="1" max="200" /></label>
    </div>
    <div class="row">
      <label>排序
        <select id="sort">
          <option value="综合排序">综合排序</option>
          <option value="最新发布">最新发布</option>
          <option value="最多点赞">最多点赞</option>
        </select>
      </label>
    </div>
    <div class="row col">
      <div class="row tpl">
        <label class="grow">文件名模板
          <input id="template" type="text" spellcheck="false" placeholder="留空则用默认" />
        </label>
        <button id="resetTemplate" class="ghost small">恢复默认</button>
      </div>
      <div class="hint">
        变量：<code>{desc}</code> 标题前 40 字（无标题时用笔记 ID）、<code>{seq}</code> 本次下载的全局序号（跨笔记连续）、<code>{index}</code> 笔记内图片序号、<code>{noteId}</code> 笔记 ID、<code>{author}</code> 昵称、<code>{user}</code> 抖音号、<code>{keyword}</code> 关键词。
        序号可写位数补齐：<code>{seq:3}</code> → <code>001</code>，<code>{index:2}</code> → <code>01</code>（最多 9 位）。
        模板里有 <code>/</code> 就分目录、没有就平铺。<b>不写扩展名就不加</b>，Chrome 会按图片真实类型补 <code>.webp</code>/<code>.jpg</code>。非法字符会被清掉。
      </div>
      <div id="preview" class="preview">预览（内置示例笔记）：—</div>
    </div>
    <div class="row">
      <label class="check">
        <input id="append" type="checkbox" checked />
        追加模式（保留上次结果，跨任务按笔记 ID 去重）
      </label>
    </div>

    <div class="cache">
      <div id="cacheInfo">缓存：读取中…</div>
      <button id="clearCache" class="ghost small">清空缓存</button>
    </div>

    <div class="row btns">
      <button id="start">开始收集</button>
      <button id="stop" class="ghost">停止</button>
      <button id="clear" class="ghost">清空</button>
    </div>

    <div id="status" class="status">空闲</div>

    <details open>
      <summary>日志</summary>
      <pre id="logs"></pre>
    </details>

    <div class="row btns">
      <button id="export" class="ghost">导出 JSON</button>
      <button id="download" class="ghost">下载图片</button>
      <button id="copy" class="ghost">复制图片 URL</button>
    </div>

    <div id="list"></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
